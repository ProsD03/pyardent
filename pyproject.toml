[project]
name = "pyardent"
version = "1.0.0"
description = "Python client for the Ardent Insight API (Elite Dangerous trade/system data)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "ProsD", email = "me@prosd.dev" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic==2.13.5",
]

[project.urls]
Repository = "https://github.com/ProsD03/pyardent"
Issues = "https://github.com/ProsD03/pyardent/issues"

[build-system]
requires = ["uv_build>=0.8.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.coverage.run]
relative_files = true
