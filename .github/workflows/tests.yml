name: Tests
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      # Only used by the "Publish tests badge" step below, and only on push
      # to main. Forked pull_request runs are downgraded to read-only by
      # GitHub regardless, so this does not grant write access to untrusted
      # code.
      contents: write # push the tests badge to the tests-badge-data branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: 'true'
      - run: uv sync
      - name: Run tests
        run: |
          mkdir -p reports/junit
          uv run pytest --junitxml=reports/junit/junit.xml
      - name: Generate tests badge
        if: always()
        run: |
          mkdir -p badge
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          root = ET.parse("reports/junit/junit.xml").getroot()
          tests = failures = errors = skipped = 0
          for suite in root.findall(".//testsuite"):
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))

          passed = tests - failures - errors - skipped
          total = tests - skipped
          pct = (passed / total * 100) if total else 100

          if pct < 50:
              color = "red"
          elif pct < 75:
              color = "orange"
          elif pct < 90:
              color = "green"
          else:
              color = "brightgreen"

          url = "https://img.shields.io/badge/{}-{}-{}.svg".format(
              quote("Tests", safe=""),
              quote(f"{passed}/{total}", safe=""),
              quote(color, safe=""),
          )

          req = Request(url, headers={"User-Agent": "pyardent-ci"})
          with urlopen(req) as resp, open("badge/tests-badge.svg", "wb") as f:
              f.write(resp.read())
          PY
      - name: Publish tests badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: tests-badge-data
          publish_dir: badge
          force_orphan: true
